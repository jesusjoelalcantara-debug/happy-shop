<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
   <div class="brand">
  <img src="img/Logo joel.png" alt="Happy Shop">
</div>
    <nav id="categoryNav"></nav>
    <button id="cartBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="#F4915C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="21" r="1"></circle>
    <circle cx="20" cy="21" r="1"></circle>
    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
  </svg>
  <span id="cartCount">0</span>
</button>
  </header>

  <section class="hero">
    <h1>Personalización &amp; ventas de artículos online</h1>
    <p>Tazas, camisetas, abrigos y termos hechos a tu gusto.</p>
  </section>

  <main>
    <div id="productGrid"></div>
  </main>

  <aside id="drawer">
  <h3>Tu carrito</h3>
  <div id="drawerItems"></div>
  <p class="total-row">Total: <span id="totalPrice">RD$ 0</span></p>
  <button id="checkoutBtn" onclick="checkoutWhatsApp()">Enviar pedido por WhatsApp</button>
</aside>

  <script src="script.js"></script>
</body>
</html>
